<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBA 316 creating book review log(personal book log)</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="wrapper">
    <header>
        <h2>My library Shelf</h2>
    </header>

    <form id="bookForm" novalidate>
        <div class = "input-box">
            <label for="book Title">Book Title:</label>
            <input type="text" id="bookTitle" required minlength="3" placeholder="at least 3 characters">
            <div class="alert-hint" id="titleValidationHint">Title must containat least 3 charaters.</div>
        </div>
        
        <!---- input for js titleValidationHint-->
        <div class="input-box">
            <label for="bookReview">Short Review Notes:</label>
            <input type="text" id="bookreview" placeholder="Avoid text summary like 'boring'">
            <div class="alert-hint" id="reviewValidationHint">Review details blocklisted words!</div>
        </div>
        <button type="submit">Add to shelf</button>
        </form>
</body>
</html>
